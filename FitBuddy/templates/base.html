<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FitBuddy{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Fit<span>Buddy</span></a>
  <nav>
    <a href="/">New Plan</a>
    <a href="/admin/login">Admin</a>
  </nav>
</header>
<main class="container">
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert success">{{ success }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer>FitBuddy • AI-assisted fitness planning • For general wellness information, not medical care.</footer>
</body>
</html>
